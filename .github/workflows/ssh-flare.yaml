name: SSH via Cloudflare Quick Tunnel

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng của GitHub Actions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment & SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server tmux htop curl wget git build-essential
          sudo systemctl start ssh
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod 700 ~/.ssh

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url ssh://localhost:22 > cloudflared.log 2>&1 &
          
          echo "Đang đợi Cloudflare cấp URL Tunnel..."
          for i in {1..15}; do
            if grep -q 'trycloudflare.com' cloudflared.log; then
              break
            fi
            sleep 2
          done

          echo "========================================================"
          echo " LỆNH KẾT NỐI SSH CHO TERMUX:"
          URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cloudflared.log | head -n 1 | sed 's|https://|ssh runner@|g')
          if [ -n "$URL" ]; then
            echo "$URL"
          else
            echo "Chưa lấy được URL tự động, đây là toàn bộ log Cloudflare:"
            cat cloudflared.log
          fi
          echo "========================================================"

      - name: Keep Runner Alive (Max 6 hours)
        run: |
          echo "SSH Session đã sẵn sàng! Mày có 6 tiếng để dùng."
          sleep 21600