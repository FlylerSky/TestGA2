# GitHub Actions workflow — copy this file to:
#   .github/workflows/connect.yaml
#
# Repo layout expected after checkout (one of):
#   Actions/server.js + Actions/package.json + Actions/lib/
#   OR flat: server.js + package.json + lib/ at repo root
#
# Required repository secrets:
#   RELAY_URL    e.g. wss://your-service.onrender.com/ws
#   RELAY_TOKEN  same value as RELAY_TOKEN on Render

name: GHA Interactive Terminal

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Session name (must match client --session)'
        required: false
        default: 'default'
      timeout_minutes:
        description: 'Max job runtime (minutes)'
        required: false
        default: '120'
      shell:
        description: 'Shell binary on the runner'
        required: false
        default: 'bash'

concurrency:
  group: gha-terminal-${{ github.event.inputs.session || 'default' }}
  cancel-in-progress: true

jobs:
  terminal:
    name: Interactive shell via relay
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '120') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do NOT use cache: npm here.
      # setup-node fails the job with:
      #   "Some specified paths were not resolved, unable to cache dependencies"
      # when package-lock.json is missing or cache-dependency-path is wrong.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate Actions package
        id: loc
        run: |
          set -euo pipefail
          echo "== repo tree (top) =="
          ls -la
          if [ -f Actions/server.js ] && [ -f Actions/package.json ]; then
            echo "dir=Actions" >> "$GITHUB_OUTPUT"
            echo "Found Actions/ layout"
          elif [ -f server.js ] && [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Found repo-root layout"
          else
            echo "::error::Neither Actions/server.js nor ./server.js found. Commit the Actions/ folder (server.js, package.json, lib/) to this repo."
            find . -maxdepth 3 -type f \( -name 'server.js' -o -name 'package.json' -o -name 'connect.yaml' \) 2>/dev/null || true
            exit 1
          fi

      - name: Install native build deps (node-pty)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 pkg-config

      - name: Install npm dependencies
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi

      - name: Show connection hint
        run: |
          echo "============================================================"
          echo "  Server is dialing the relay…"
          echo "  On your laptop run:"
          echo ""
          echo "    cd Client && npm install"
          echo "    node client.js \\"
          echo "      --relay \"\$RELAY_URL\" \\"
          echo "      --token \"\$RELAY_TOKEN\" \\"
          echo "      --session \"${{ github.event.inputs.session || 'default' }}\" \\"
          echo "      -L 8080:127.0.0.1:8080"
          echo ""
          echo "  Detach client with Ctrl+]"
          echo "  Cancel this workflow when finished."
          echo "============================================================"

      - name: Start PTY server (connect to relay)
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          SESSION: ${{ github.event.inputs.session || 'default' }}
          SHELL_BIN: ${{ github.event.inputs.shell || 'bash' }}
          COLS: '120'
          ROWS: '40'
        run: |
          set -euo pipefail
          if [ -z "${RELAY_URL:-}" ]; then
            echo "::error::Secret RELAY_URL is empty. Set it to wss://YOUR-APP.onrender.com/ws"
            exit 1
          fi
          if [ -z "${RELAY_TOKEN:-}" ]; then
            echo "::error::Secret RELAY_TOKEN is empty. Must match Render RELAY_TOKEN"
            exit 1
          fi
          echo "RELAY_URL host: $(echo "$RELAY_URL" | sed -E 's#^[a-z]+://##' | cut -d/ -f1)"
          echo "SESSION=$SESSION"
          node server.js --session "$SESSION"